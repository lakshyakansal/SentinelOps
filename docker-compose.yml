services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelops}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  ai-service:
    build: ./ai-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/${POSTGRES_DB:-sentinelops}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  incident-service:
    build: ./services/incident-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinelops}
      DB_USER: ${POSTGRES_USER:-sentinel}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      AI_SERVICE_URL: http://ai-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
    ports: ["8082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      ai-service: {condition: service_started}
  alert-service:
    build: ./services/alert-service
    environment:
      INCIDENT_SERVICE_URL: http://incident-service:8082
    ports: ["8081:8081"]
    depends_on: [incident-service]
  notification-service:
    build: ./services/notification-service
    environment:
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    ports: ["8083:8083"]
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [alert-service, incident-service, ai-service]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports: ["5173:80"]
    depends_on: [gateway]
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    ports: ["3001:3000"]
    depends_on: [prometheus]
volumes:
  pgdata:
