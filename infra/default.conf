server {
 listen 80;
 client_max_body_size 2m;
 location /api/v1/alerts { proxy_pass http://alert-service:8081; proxy_set_header Host $host; }
 location /api/v1/incidents { proxy_pass http://incident-service:8082; proxy_set_header Host $host; }
 location /analyze { proxy_pass http://ai-service:8000/analyze; }
 location /health { proxy_pass http://ai-service:8000/health; }
}
